# Local Postgres for rvn-agent-api persistence.
#
#   docker compose up -d
#   export RVN_DATABASE_URL=postgres://rvn:rvn@localhost:5432/rvn_agent_api
#   pnpm dev
#
# The API applies the versioned migrations in src/store/migrations/ at
# startup (tracked in the schema_migrations table), so a fresh volume needs
# no schema pre-seeding and an existing database upgrades in place.
# Tear down with: docker compose down -v

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rvn_agent_api
      POSTGRES_USER: rvn
      POSTGRES_PASSWORD: rvn
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
