[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-rvn"
version = "0.13.0"
description = "LangChain tools wrapping the rvn-agent-api policy-gated Ravencoin API"
requires-python = ">=3.10"
dependencies = ["langchain-core>=0.3"]

[tool.setuptools]
packages = ["langchain_rvn"]
